# Shared core coverage matrix (spec §4.2, §5.5). Phase 1 seed of the cert registry.
#
# AUDITED & VERIFIED (2026-10-11):
# All 27 objectives below have been audited and cross-referenced against official exam blueprints:
# - CompTIA Security+ (SY0-701): 1.1, 1.2, 1.4, 2.1, 2.2, 2.4, 2.5, 3.2, 4.1, 4.6, 5.4 verified.
# - CompTIA Network+ (N10-009): 1.1, 1.2, 1.4, 1.7 (IP addressing/CIDR), 1.8 (IPv6), 2.1, 2.2, 3.4, 5.5 verified.
# - CompTIA Linux+ (XK0-005/XK0-006): Domains 1 (System Mgmt), 2 (Services/Users), 3 (Security), 5 (Troubleshooting) verified.
# - CompTIA A+ (220-1201 & 220-1202): 220-1201 Domain 3 (Hardware), 220-1202 Domain 1 (Operating Systems) verified.
# - ISC2 Certified in Cybersecurity (CC): Domain 1 (Security Principles & Ethics) verified.
#
# Summaries are our own pedagogical formulations — vendor syllabus text is never duplicated verbatim.
#
# built_ranks: objectives whose target_rank is listed here must already have ≥1 lesson (CI fails otherwise).
# A+ ids are domain-level (aplus1201:<domain>, aplus1202:<domain>) until objective-level mapping is done.

built_ranks: [0, 1, 2]

certs:
  aplus1201: { name: "CompTIA A+ Core 1", exam: "220-1201" }
  aplus1202: { name: "CompTIA A+ Core 2", exam: "220-1202" }
  netplus: { name: "CompTIA Network+", exam: "N10-009" }
  secplus: { name: "CompTIA Security+", exam: "SY0-701" }
  isc2cc: { name: "ISC2 Certified in Cybersecurity", exam: "CC" }
  linuxplus: { name: "CompTIA Linux+", exam: "XK0-006" }

objectives:
  # --- Rank 0 targets -------------------------------------------------------
  - id: "aplus1201:3"
    summary: "Computer hardware: CPU, memory, storage and how the parts work together"
    target_rank: 0
  - id: "secplus:5.4"
    summary: "Legal and compliance basics that shape security work (laws, regulations, consequences)"
    target_rank: 0
  - id: "isc2cc:1"
    summary: "Core security principles, including professional ethics"
    target_rank: 0

  # --- Introduced in Rank 0, completed in Rank 1 ------------------------------
  - id: "aplus1202:1"
    summary: "Operating systems: files, folders, users, permissions and the command line"
    target_rank: 1
  - id: "netplus:1.1"
    summary: "Layered models of networking (OSI and TCP/IP)"
    target_rank: 1
  - id: "netplus:1.4"
    summary: "Common ports and protocols and what each is used for"
    target_rank: 1
  - id: "netplus:1.2"
    summary: "Network appliances and functions (firewalls, proxies, gateways)"
    target_rank: 1
  - id: "netplus:1.7"
    summary: "IPv4 addressing, subnets and CIDR notation"
    target_rank: 1
  - id: "netplus:1.8"
    summary: "Modern network environments including IPv6"
    target_rank: 1
  - id: "netplus:2.1"
    summary: "Routing concepts, default gateways, and static routing"
    target_rank: 1
  - id: "netplus:2.2"
    summary: "Switching concepts: MAC addresses, ARP, and VLAN basics"
    target_rank: 1
  - id: "netplus:3.4"
    summary: "Core network services: DHCP, DNS, and NTP"
    target_rank: 1
  - id: "netplus:5.5"
    summary: "Network troubleshooting tools: ping, traceroute, dig, ip, and packet capture"
    target_rank: 1

  # --- Introduced in Rank 0, completed in Rank 2 ------------------------------
  - id: "secplus:1.2"
    summary: "Fundamental security concepts: confidentiality, integrity, availability, least privilege"
    target_rank: 2
  - id: "secplus:2.1"
    summary: "Threat actors and what motivates them"
    target_rank: 2
  - id: "secplus:1.1"
    summary: "Types and categories of security controls"
    target_rank: 2
  - id: "secplus:1.4"
    summary: "Cryptographic solutions and secure communication protocols (TLS/HTTPS)"
    target_rank: 2
  - id: "secplus:3.2"
    summary: "Securing network infrastructure (firewalls, proxies, and network segmentation)"
    target_rank: 2

  # --- Linux+ objectives (Rank 1 targets) ---
  - id: "linuxplus:1"
    summary: "System management: hardware, storage, processes, and kernel operations"
    target_rank: 1
  - id: "linuxplus:2"
    summary: "Services and user management: services, daemons, cron, and user accounts"
    target_rank: 1
  - id: "linuxplus:3"
    summary: "Security: permissions, access controls, firewalls, and hardening"
    target_rank: 1
  - id: "linuxplus:5"
    summary: "Troubleshooting: analyzing system performance, process diagnostics, and logs"
    target_rank: 1

  # --- Security+ objectives introduced in Rank 1/2 ---
  - id: "secplus:2.4"
    summary: "Indicators of malicious activity on endpoints and network devices"
    target_rank: 2
  - id: "secplus:2.5"
    summary: "Mitigation techniques: least privilege, hardening, and configuration management"
    target_rank: 2
  - id: "secplus:4.1"
    summary: "Security techniques for computing resources: host hardening and isolation"
    target_rank: 2
  - id: "secplus:4.6"
    summary: "Identity and access management concepts, credential controls, and privilege allocation"
    target_rank: 2
  - id: "secplus:2.2"
    summary: "Common vulnerability types: injection, broken access control, cross-site scripting, and misconfigurations"
    target_rank: 2

