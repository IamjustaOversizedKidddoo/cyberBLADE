version: 1
description: "Tool-raised severity calibration table. Outlines how simulated sensors assign initial severity ratings, documenting realistic sensor biases (over-rating, under-rating, static rules) to prevent learners from naively trusting tool labels."

calibrationRules:
  # Email Security Gateway
  - ruleName: "Email Gateway: Suspicious Inbound URL from Newly Registered Domain"
    source: "Email Gateway"
    toolRaisedSeverity: "HIGH"
    bias: "over_rated"
    rationale: "Gateway triggers HIGH on any domain registered within 14 days, regardless of content safety. Frequently generates false alarms on newly launched legitimate partner sites or marketing landing pages."
    investigationAction: "Inspect SPF/DKIM/DMARC alignment, analyze URL destination path, and check whether recipient navigated."

  - ruleName: "Email Gateway: Macro-Enabled Office Attachment Delivered"
    source: "Email Gateway"
    toolRaisedSeverity: "MEDIUM"
    bias: "under_rated"
    rationale: "Gateway tags macro-enabled attachments as MEDIUM because macros are common in financial departments. When weaponized, this is an initial access vector that should be treated as HIGH or CRITICAL."
    investigationAction: "Correlate with EDR endpoint process execution logs to verify if parent process spawned script interpreters."

  - ruleName: "Email Gateway: Inbound Message with Unverified Sender Authentication"
    source: "Email Gateway"
    toolRaisedSeverity: "LOW"
    bias: "under_rated"
    rationale: "Flags SPF neutral/softfail or missing DKIM as LOW because many external marketing senders have misconfigured DNS records. However, targeted spoofing often hides under softfail."
    investigationAction: "Verify sender envelope address vs header From address and check domain age."

  # Web Application Firewall & Web Servers
  - ruleName: "WAF: SQL Injection Attack Pattern Blocked"
    source: "Network IDS"
    toolRaisedSeverity: "CRITICAL"
    bias: "over_rated"
    rationale: "WAF rules trigger CRITICAL on known SQL injection keywords (UNION, SELECT, SLEEP) regardless of whether the exploit was blocked. When returning HTTP 403 Forbidden, this is harmless ambient scanner noise."
    investigationAction: "Check web server access log status code. If HTTP 403/400, dismiss as blocked noise. If HTTP 200 with large byte transfer, escalate as active compromise."

  - ruleName: "WAF: Path Traversal Attempt in HTTP Request"
    source: "Network IDS"
    toolRaisedSeverity: "HIGH"
    bias: "over_rated"
    rationale: "Automated internet bots test '../etc/passwd' constantly against public endpoints. High alert volume represents untargeted reconnaissance when returning 404 or 400."
    investigationAction: "Examine HTTP response code and server response size to differentiate scanner probes from successful file read."

  - ruleName: "Web Server: Anomalous Web Application Response Size"
    source: "Authentication"
    toolRaisedSeverity: "MEDIUM"
    bias: "under_rated"
    rationale: "High byte transfers (> 500 KB) on search endpoints are flagged as MEDIUM heuristic anomalies. If an attacker dumped database tables via SQLi, this represents critical data exfiltration."
    investigationAction: "Inspect application query parameters and correlate with database audit logs."

  # Endpoint Detection & Response (EDR)
  - ruleName: "EDR: Living-Off-The-Land Binary (certutil) Network Connection"
    source: "EDR"
    toolRaisedSeverity: "CRITICAL"
    bias: "static_per_rule"
    rationale: "Static rule matching certutil.exe connecting to remote network addresses. Accurately flags binary staging, but also triggers on legitimate internal PKI CRL lookups."
    investigationAction: "Inspect command-line arguments: -verify against internal PKI is benign; -urlcache downloading .bin/.exe from external domain is malicious."

  - ruleName: "EDR: Living-Off-The-Land Binary Execution"
    source: "EDR"
    toolRaisedSeverity: "HIGH"
    bias: "over_rated"
    rationale: "Fires on any administrative invocation of powershell, wmic, or certutil. Routine IT administrative scripts frequently trigger this rule."
    investigationAction: "Examine script path, parent process, execution user, and whether script is signed or part of approved IT maintenance."

  - ruleName: "EDR: Encoded PowerShell Command Execution"
    source: "EDR"
    toolRaisedSeverity: "CRITICAL"
    bias: "calibrated"
    rationale: "Base64-encoded (-EncodedCommand / -Enc) PowerShell execution is heavily favored by adversaries to bypass simple string inspection. High true-positive correlation."
    investigationAction: "Base64-decode the command string to inspect underlying payload, download cradles, or persistence hooks."

  - ruleName: "EDR: System Package Upgrade Sequence"
    source: "EDR"
    toolRaisedSeverity: "MEDIUM"
    bias: "over_rated"
    rationale: "Automated package managers (apt-get, dnf, yum) modifying binaries in /usr/bin trigger elevated severity rules. When executed during maintenance windows, this is routine patch rollout."
    investigationAction: "Check execution window, parent daemon (systemd-update vs interactive shell), and target package names."

  # Network IDS & Flow Monitoring
  - ruleName: "Network IDS: Automated SSH Login Dictionary Attack"
    source: "Network IDS"
    toolRaisedSeverity: "HIGH"
    bias: "static_per_rule"
    rationale: "Fires when > 50 SSH connection attempts occur within 60 seconds. Does not evaluate whether the attack succeeded."
    investigationAction: "Correlate with server auth.log. If all attempts failed, it is noise; if 'Accepted password' follows, it is a critical intrusion."

  - ruleName: "Network IDS: Rapid Port Sweep Probe"
    source: "Network IDS"
    toolRaisedSeverity: "HIGH"
    bias: "over_rated"
    rationale: "Fires on sequential SYN probes across port ranges. Internal vulnerability scanning appliances trigger this alert constantly during scheduled scan windows."
    investigationAction: "Verify source IP against authorized vulnerability scanner list and scan schedule."

  - ruleName: "Network IDS: High-Entropy DNS Subdomain Query Burst"
    source: "Network IDS"
    toolRaisedSeverity: "HIGH"
    bias: "calibrated"
    rationale: "Fires when hundreds of unique, randomized subdomains are queried in rapid succession. High probability of DNS tunneling or domain generation algorithms (DGA)."
    investigationAction: "Inspect query type (TXT vs A), domain registrar, parent domain reputation, and byte volume."

  - ruleName: "Network IDS: Protocol Header Parsing Anomaly"
    source: "Network IDS"
    toolRaisedSeverity: "LOW"
    bias: "under_rated"
    rationale: "Flapping sensors produce repetitive LOW alerts on malformed legacy HTTP keep-alives or non-standard TCP options. Frequently dismissed as noise."
    investigationAction: "Verify whether sensor is flapping on benign internal traffic or if anomaly represents custom C2 encapsulation."

  # Identity Provider & Authentication
  - ruleName: "Authentication: External Brute Force Culminating in Successful Logon"
    source: "Authentication"
    toolRaisedSeverity: "CRITICAL"
    bias: "calibrated"
    rationale: "Fires when multiple failed logon events are followed immediately by an accepted authentication session from the same external IP."
    investigationAction: "Verify if login IP belongs to authorized staff VPN or unexpected external network; initiate immediate account containment if unauthorized."

  - ruleName: "Authentication: Multiple Failed Logons Followed by Password Change"
    source: "Authentication"
    toolRaisedSeverity: "MEDIUM"
    bias: "over_rated"
    rationale: "Often triggered when a user forgets their password, fails 3 times, uses self-service reset, and experiences sync latency on cached credentials."
    investigationAction: "Verify reset channel (self-service SSO portal with MFA vs admin reset) and subsequent login source."

  - ruleName: "Identity: Cloud Management Console Logon from Novel ASN"
    source: "Authentication"
    toolRaisedSeverity: "MEDIUM"
    bias: "under_rated"
    rationale: "Tagged as MEDIUM because remote employees frequently roam across mobile carriers and ISPs. If attacker bypassed MFA via stolen session cookie, this represents full cloud tenant access."
    investigationAction: "Compare ASN/city against employee work location, device compliance state, and subsequent IAM actions."

  - ruleName: "Identity: Rapid Consecutive Multi-Factor Authentication Push Prompts"
    source: "Authentication"
    toolRaisedSeverity: "HIGH"
    bias: "calibrated"
    rationale: "Fires when 5+ push notifications are sent within a 2-minute window. Strong signature of MFA fatigue / push bombing attack."
    investigationAction: "Check whether push was accepted, time of acceptance (off-hours vs business), and IP of following authenticated session."

  # Cloud & Infrastructure Audit
  - ruleName: "Cloud Audit: Administrator IAM Policy Attached to User"
    source: "Authentication"
    toolRaisedSeverity: "HIGH"
    bias: "under_rated"
    rationale: "Alert fires as HIGH, but attaching AdministratorAccess or Owner roles to an unauthorized identity is a CRITICAL persistence event."
    investigationAction: "Verify caller identity (automated Terraform CI service vs manual user credentials) and change management ticket."

  - ruleName: "Cloud Audit: Programmatic Access Key Created for Existing Identity"
    source: "Authentication"
    toolRaisedSeverity: "MEDIUM"
    bias: "under_rated"
    rationale: "Developers regularly create API keys for local testing, so tools rate this as MEDIUM. In an attack chain, this creates persistent backdoor credentials."
    investigationAction: "Check calling IP address, user agent, and whether key creation complies with service principal policy."
