groundTruth:
  incidents:
    - id: "inc-phish-cred"
      title: "Credential Theft via Phishing & Account Takeover (jdoe)"
      category: "credential_access"
      description: "Phishing lure delivered to Jane Doe in Finance led to credential submission on fake portal, followed by unauthorized external login, mailbox exfiltration rule, and LSASS memory access attempt."
      timeline:
        - "2026-10-12T08:14:22Z: Phishing email delivered with invoice lure link"
        - "2026-10-12T08:16:05Z: User navigated to portal.invoice-secure.example and entered credentials"
        - "2026-10-12T08:22:18Z: Attacker authenticated from external IP 198.51.100.44"
        - "2026-10-12T08:25:40Z: Malicious mailbox rule created to forward financial emails to external dropbox"
        - "2026-10-12T08:27:10Z: Host-level LSASS access attempted on ws-fin-04"
      truePositiveAlertIds: ["alt-001", "alt-002", "alt-003", "alt-004"]
      rootCause: "Targeted spear-phishing credential harvesting attack exploiting lack of FIDO2 hardware MFA requirement on legacy web SSO endpoint."
      mitre: ["T1566.002", "T1078", "T1114.003", "T1003.001"]

    - id: "inc-ssh-bruteforce"
      title: "External SSH Brute Force and Reverse Shell on DMZ Staging Server"
      category: "initial_access"
      description: "External adversary from 203.0.113.88 conducted high-velocity password spraying against staging_deploy account, gained access, dropped second-stage payload via curl, and established interactive reverse shell."
      timeline:
        - "2026-10-12T08:31:10Z: High volume SSH password guessing initiated from 203.0.113.88"
        - "2026-10-12T08:35:45Z: Successful SSH login for staging_deploy"
        - "2026-10-12T08:38:00Z: curl invoked to pull /tmp/.x11-conf from attacker web server"
        - "2026-10-12T08:39:10Z: Outbound reverse shell connected to 203.0.113.88:4444"
      truePositiveAlertIds: ["alt-005", "alt-006", "alt-007", "alt-008"]
      rootCause: "Weak password on exposed DMZ staging server with SSH password authentication enabled to the public internet."
      mitre: ["T1110.001", "T1021.004", "T1105", "T1059.004"]

    - id: "inc-lolbin-exec"
      title: "Living-off-the-Land (Certutil) Download & Registry Persistence (asmith)"
      category: "execution_and_persistence"
      description: "Adversary on ws-eng-09 abused certutil.exe to download malicious binary, installed registry Run key persistence under HKCU, and established recurring C2 beaconing."
      timeline:
        - "2026-10-12T09:05:12Z: certutil.exe -urlcache executed to pull payload.bin"
        - "2026-10-12T09:08:44Z: Registry Run key ApexTelemetryAgent created for persistence"
        - "2026-10-12T09:11:02Z: Encoded PowerShell launched for local discovery"
        - "2026-10-12T09:12:30Z: Fixed-interval outbound C2 beaconing observed"
      truePositiveAlertIds: ["alt-009", "alt-010", "alt-011", "alt-012"]
      rootCause: "Execution of unapproved executable leveraging dual-use Windows management utility (LOLBin) to evade basic perimeter filters."
      mitre: ["T1105", "T1547.001", "T1059.001", "T1071.001"]

  overallDebrief: |
    SHIFT OVERVIEW & GRADING DEBRIEF:
    Apex Dynamics experienced three distinct intrusion chains during this shift:
    1. A credential-harvesting phishing attack targeting Finance user Jane Doe (ws-fin-04), leading to session hijacking and unauthorized mail forwarding.
    2. An external SSH brute force compromise on the internet-exposed DMZ staging server (srv-stage-01) culminating in an interactive reverse shell.
    3. A Living-off-the-Land (LOLBin) attack using certutil.exe and registry persistence on developer workstation ws-eng-09.

    Out of 48 total alerts, 12 represented active malicious attack milestones across these 3 incidents.
    The remaining 36 alerts were benign true positives, false positives, or duplicate firewall telemetry.
    Successful analysts correctly classified the true attacks, escalated with concise reasoning, and avoided over-escalating the routine IT maintenance noise.
