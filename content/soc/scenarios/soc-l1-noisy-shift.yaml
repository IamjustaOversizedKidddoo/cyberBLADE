id: soc-l1-noisy-shift
version: 1
title: "L1 Shift: A Noisy Morning Shift at Apex Dynamics"
level: L1
estimatedMinutes: 45
skillsTested:
  - soc_alert_triage
  - soc_phishing_analysis
  - soc_network_traffic
  - soc_windows_logs
  - soc_linux_logs
  - soc_malware_triage
  - soc_threat_intel
  - soc_case_management
difficulty: intermediate
briefing: |
  Welcome to your Tier-1 analyst morning shift at Apex Dynamics Corp.
  Overnight telemetry has produced 48 alerts across EDR, Network IDS, Authentication, Email Gateway, and Firewall sensors.
  Your objective:
  1. Triage alerts systematically. Isolate true security incidents from benign background activity and false positives.
  2. For every alert, designate an accurate disposition and provide defensible triage reasoning.
  3. Escalate confirmed threats to Tier 2 or Incident Response, and group correlated alerts into investigation cases.
  4. Avoid over-escalating benign activity or false alarms.

