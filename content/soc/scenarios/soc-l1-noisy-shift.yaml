alerts:
  # =========================================================================
  # INCIDENT 1: Phishing to Account Takeover (jdoe / ws-fin-04)
  # =========================================================================
  - id: alt-001
    timestamp: "2026-10-12T08:14:25Z"
    source: "Email Gateway"
    ruleName: "SUSPICIOUS_OUTBOUND_LINK_CLICK"
    severity: "MEDIUM"
    summary: "User jdoe clicked an unclassified external link in message from billing-update@invoice-secure.example"
    relatedAsset: "ws-fin-04.corp.internal"
    relatedUser: "jdoe"
    relatedIocs:
      - type: "domain"
        value: "portal.invoice-secure.example"
      - type: "email"
        value: "billing-update@invoice-secure.example"
    linkedRawEvents: ["evt-101", "evt-102"]
    rawFields:
      sender: "billing-update@invoice-secure.example"
      link: "https://portal.invoice-secure.example/auth/login"
      destination_ip: "198.51.100.44"
    groundTruth:
      kind: "true_positive"
      correctDisposition: "true_positive"
      correctSeverity: "HIGH"
      correctEscalation: true
      targetTier: "incident_response"
      incidentId: "inc-phish-cred"
      debrief: "True Positive. User jdoe received a targeted phishing lure mimicking vendor invoice updates and navigated to credential harvest portal."

