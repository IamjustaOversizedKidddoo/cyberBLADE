metadata:
  id: "soc-f-alert-fatigue-01"
  version: 1
  title: "L1: Operational Noise, Scanner Bursts & False-Positive Dissection"
  level: "L1"
  skillsTested:
    - "soc_alert_triage"
    - "soc_false_positive_id"
    - "soc_network_indicators"
    - "soc_documentation"
  estimatedMinutes:
    min: 25
    max: 50
  difficultyRange:
    - "beginner"
    - "intermediate"
    - "advanced"
  author: "CyberBLADE SOC Curriculum Engineering"
  reviewStatus: "draft"
  reviewerNotes: "Initial draft modeling high-volume scanner bursts, flapping signatures, and noise triage."

environmentTemplate:
  organizationArchetypes:
    - "org_apex_dynamics"
    - "org_vanguard_logistics"
    - "org_helios_energy"
    - "org_nexus_saas"
  assetDistribution:
    workstations:
      min: 4
      max: 7
    servers:
      min: 2
      max: 4
    domainControllers:
      min: 1
      max: 1
    mailGateways:
      min: 1
      max: 1
  userDistribution:
    totalUsers:
      min: 6
      max: 10
    departments:
      - "Finance"
      - "Engineering"
      - "IT Operations"
      - "Human Resources"
      - "Marketing"

incidentTemplates:
  - id: "inc-stealth-scan-exploit"
    titleTemplate: "Targeted Web Exploitation Concealed within Scanner Bursts on {targetServer}"
    category: "Web & Application Exploitation"
    rootCauseTemplate: "Attacker at {attackerIp} concealed targeted SQL injection exploit within high-volume automated reconnaissance noise, obtaining database records."
    mitreTags:
      - "T1190" # Exploit Public-Facing Application
      - "T1595.002" # Vulnerability Scanning
    stages:
      - stageId: "stage-targeted-sqli"
        name: "Targeted SQL Injection Extraction"
        phase: "initial_access"
        timingOffsetMinutes:
          min: 10
          max: 50
        jitterMinutes: 2
        eventTemplates:
          - source: "Network IDS"
            action: "http_request"
            messageTemplate: "{attackerIp} - - [12/Oct/2026:08:30:00 +0000] 'GET /products?id=1%20UNION%20SELECT%20null,username,password%20FROM%20users-- HTTP/1.1' 200 845210"
            fieldsTemplate:
              client_ip: "{attackerIp}"
              method: "GET"
              status_code: 200
              bytes_sent: 845210
        alertTemplates:
          - ruleName: "Web Server: Anomalous Web Application Response Size"
            source: "Network IDS"
            severity: "MEDIUM"
            summaryTemplate: "Web exploit succeeded with elevated byte response on host '{targetServer}' from remote address {attackerIp}"
            relatedAssetBinding: "targetServer"
            relatedUserBinding: "targetServer"
            iocs:
              - type: "ip"
                valueTemplate: "{attackerIp}"
            rawFieldsTemplate:
              source_ip: "{attackerIp}"
              target_host: "{targetServer}"
              status_code: 200
              bytes_sent: 845210
        groundTruth:
          kind: "true_positive"
          correctDisposition: "true_positive"
          correctSeverity: "CRITICAL"
          correctEscalation: true
          targetTier: "tier2"
          minimumEvidenceSet:
            - "stage-targeted-sqli"
          acceptableAlternatives: []
          debriefTemplate: "Confirmed web compromise on {targetServer}. Attacker at {attackerIp} exploited SQL injection returning HTTP 200 with database records."

benignTemplates:
  - id: "benign-vuln-scanner"
    name: "Authorized Weekly Perimeter Vulnerability Scan"
    category: "Vulnerability Scanning"
    frequencyRange:
      min: 6
      max: 12
    timePattern: "batch_window_nightly"
    actorRole: "security_scanner"
    eventTemplates:
      - source: "Network IDS"
        action: "port_scan"
        messageTemplate: "TCP port sweep detected from scanner IP {scannerIp}"
        fieldsTemplate:
          source_ip: "{scannerIp}"
          target_host: "{hostname}"
    alertTemplates:
      - ruleName: "Network IDS: Rapid Port Sweep Probe"
        source: "Network IDS"
        severity: "HIGH"
        summaryTemplate: "Rapid port sweep probe from authorized internal vulnerability scanner address {scannerIp} on host '{hostname}'"
        rawFieldsTemplate:
          source_ip: "{scannerIp}"
          target_host: "{hostname}"
          authorized_scanner: true
          status: "scheduled_audit"
    groundTruth:
      kind: "benign_true_positive"
      correctDisposition: "benign_true_positive"
      correctSeverity: "MEDIUM"
      correctEscalation: false
      minimumEvidenceSet:
        - "benign-vuln-scanner"
      acceptableAlternatives: []
      debriefTemplate: "Authorized vulnerability scanning from known scanner IP {scannerIp}. Baseline approved activity."

  - id: "benign-sensor-flapping"
    name: "Duplicate Sensor Trigger on Benign Keep-Alive"
    category: "Telemetry Flapping"
    frequencyRange:
      min: 6
      max: 12
    timePattern: "anytime"
    actorRole: "sensor_glitch"
    eventTemplates:
      - source: "Network IDS"
        action: "protocol_anomaly"
        messageTemplate: "Malformed HTTP keepalive header on legacy telemetry connection"
        fieldsTemplate:
          protocol: "HTTP/1.1"
    alertTemplates:
      - ruleName: "Network IDS: Protocol Header Parsing Anomaly"
        source: "Network IDS"
        severity: "LOW"
        summaryTemplate: "Repetitive protocol anomaly sensor trigger observed on internal keep-alive session from host '{hostname}'"
        rawFieldsTemplate:
          sensor_id: "suricata-dmz-01"
          target_host: "{hostname}"
          duplicate_count: 8
          protocol: "HTTP/1.1"
    groundTruth:
      kind: "duplicate"
      correctDisposition: "duplicate"
      correctSeverity: "LOW"
      correctEscalation: false
      minimumEvidenceSet:
        - "benign-sensor-flapping"
      acceptableAlternatives: []
      debriefTemplate: "Known flapping sensor alert caused by benign legacy keep-alive traffic."

  - id: "benign-backup-job"
    name: "Nightly Automated Snapshot & Backup"
    category: "Scheduled Jobs"
    frequencyRange:
      min: 4
      max: 8
    timePattern: "batch_window_nightly"
    actorRole: "service_account"
    eventTemplates:
      - source: "Authentication"
        action: "service_logon"
        messageTemplate: "Service account 'svc-backup' authenticated successfully via Kerberos"
        fieldsTemplate:
          user: "svc-backup"
          target_host: "{hostname}"
    alertTemplates:
      - ruleName: "Authentication: High-Volume Service Data Replication"
        source: "Authentication"
        severity: "MEDIUM"
        summaryTemplate: "Scheduled database snapshot stream handled by service account 'svc-backup' on corporate host '{hostname}'"
        rawFieldsTemplate:
          user: "svc-backup"
          target_host: "{hostname}"
          bytes_transferred: "42.8 GB"
          operation: "scheduled_backup"
    groundTruth:
      kind: "benign_true_positive"
      correctDisposition: "benign_true_positive"
      correctSeverity: "LOW"
      correctEscalation: false
      minimumEvidenceSet:
        - "benign-backup-job"
      acceptableAlternatives: []
      debriefTemplate: "Legitimate automated snapshot and backup initiated by approved service principal 'svc-backup'."

  - id: "benign-patch-deployment"
    name: "Central Systems Patch Rollout"
    category: "Software Deployment"
    frequencyRange:
      min: 4
      max: 8
    timePattern: "batch_window_maintenance"
    actorRole: "admin_endpoint"
    eventTemplates:
      - source: "EDR"
        action: "package_installer"
        messageTemplate: "systemd-update executed package upgrade sequence on host '{hostname}'"
        fieldsTemplate:
          process_name: "apt-get"
          target_host: "{hostname}"
    alertTemplates:
      - ruleName: "EDR: System Package Upgrade Sequence"
        source: "EDR"
        severity: "MEDIUM"
        summaryTemplate: "Automated package deployment installer executed during scheduled maintenance on corporate host '{hostname}'"
        rawFieldsTemplate:
          installer: "systemd-update"
          target_host: "{hostname}"
          operation: "patch_distribution"
          status: "installed"
    groundTruth:
      kind: "benign_true_positive"
      correctDisposition: "benign_true_positive"
      correctSeverity: "LOW"
      correctEscalation: false
      minimumEvidenceSet:
        - "benign-patch-deployment"
      acceptableAlternatives: []
      debriefTemplate: "Automated patch rollout during scheduled maintenance window."

  - id: "benign-pwd-reset"
    name: "Self-Service Credential Reset"
    category: "Identity Management"
    frequencyRange:
      min: 3
      max: 6
    timePattern: "business_hours"
    actorRole: "standard_user"
    eventTemplates:
      - source: "Authentication"
        action: "password_change"
        messageTemplate: "Self-service password change succeeded for user '{username}'"
        fieldsTemplate:
          user: "{username}"
    alertTemplates:
      - ruleName: "Authentication: Multiple Failed Logons Followed by Password Change"
        source: "Authentication"
        severity: "MEDIUM"
        summaryTemplate: "Self-service password update followed by transient authentication retries from corporate host '{hostname}'"
        rawFieldsTemplate:
          user: "{username}"
          target_host: "{hostname}"
          auth_method: "SSO_PORTAL"
          status: "synchronized"
    groundTruth:
      kind: "false_positive"
      correctDisposition: "false_positive"
      correctSeverity: "LOW"
      correctEscalation: false
      minimumEvidenceSet:
        - "benign-pwd-reset"
      acceptableAlternatives: []
      debriefTemplate: "Routine self-service password update followed by transient logon sync delays."

  - id: "benign-health-check"
    name: "Load Balancer Service Health Check Probe"
    category: "Web Infrastructure"
    frequencyRange:
      min: 4
      max: 8
    timePattern: "anytime"
    actorRole: "service_utility"
    eventTemplates:
      - source: "Network IDS"
        action: "http_request"
        messageTemplate: "10.20.1.1 - - [12/Oct/2026:08:35:00 +0000] 'GET /healthz HTTP/1.1' 200 12"
        fieldsTemplate:
          client_ip: "10.20.1.1"
          method: "GET"
          status_code: 200
          bytes_sent: 12
    alertTemplates:
      - ruleName: "Network IDS: Protocol Header Parsing Anomaly"
        source: "Network IDS"
        severity: "LOW"
        summaryTemplate: "Frequent HTTP service health probe requests from internal load balancer against corporate host '{hostname}'"
        rawFieldsTemplate:
          source_ip: "10.20.1.1"
          target_host: "{hostname}"
          endpoint: "/healthz"
          status_code: 200
    groundTruth:
      kind: "benign_true_positive"
      correctDisposition: "benign_true_positive"
      correctSeverity: "LOW"
      correctEscalation: false
      minimumEvidenceSet:
        - "benign-health-check"
      acceptableAlternatives: []
      debriefTemplate: "Routine load balancer HTTP health check probe. Safe ambient noise."

twinTemplates:
  - id: "twin-scanner-probe"
    name: "Vulnerability Scan vs Exploitation Twin Pair"
    description: "Contrasts authorized vulnerability scan probe vs targeted SQL injection exploit returning HTTP 200"
    toolOrTechnique: "Network Reconnaissance & Web Access"
    maliciousStageRef: "stage-targeted-sqli"
    benignTemplateRef: "benign-vuln-scanner"
    distinguishingEvidence: "Authorized scan originates from approved internal scanner 10.10.0.85; exploit originates from untrusted external IP and returns HTTP 200 with sensitive byte volume."
    acceptableAlternatives: []

  - id: "twin-sensor-duplicate"
    name: "Flapping Sensor Duplicate Twin Pair"
    description: "Contrasts repetitive flapping IDS alerts on benign keep-alives vs legitimate repetitive probes"
    toolOrTechnique: "Sensor Anomaly Rules"
    maliciousStageRef: "stage-targeted-sqli"
    benignTemplateRef: "benign-sensor-flapping"
    distinguishingEvidence: "Flapping sensor produces identical low-severity protocol anomaly alerts on internal sessions; exploit represents active payload execution."
    acceptableAlternatives: []

variationAxes:
  incidentCount:
    min: 1
    max: 1
  noiseRatio:
    min: 0.85
    max: 0.95
  ambiguityCount:
    min: 2
    max: 4
  telemetryGapCount:
    min: 0
    max: 2
  targetAlertCount:
    min: 35
    max: 75
  difficultyProfiles:
    beginner:
      incidentCount: 1
      noiseRatio: 0.85
      ambiguityCount: 2
      telemetryGapCount: 0
      targetAlertCount: 35
      expectedScoreCeilingNaive: 55
      expectedMinScoreReference: 85
    intermediate:
      incidentCount: 1
      noiseRatio: 0.88
      ambiguityCount: 3
      telemetryGapCount: 1
      targetAlertCount: 50
      expectedScoreCeilingNaive: 55
      expectedMinScoreReference: 85
    advanced:
      incidentCount: 1
      noiseRatio: 0.92
      ambiguityCount: 4
      telemetryGapCount: 2
      targetAlertCount: 75
      expectedScoreCeilingNaive: 50
      expectedMinScoreReference: 80

debriefTemplates:
  overallBriefingTemplate: |
    Welcome to your Tier-1 SOC shift at {orgName}.
    A heavy queue of {alertCount} incoming telemetry alerts has arrived during a busy maintenance and scanning window.
    Your mission:
    1. Filter out authorized perimeter vulnerability scans and repetitive flapping sensor glitches.
    2. Maintain situational awareness under high noise volume to detect concealed malicious attacks.
    3. Document false positive rationales and escalate verified intrusions to Tier 2.
  generalGuidanceTemplate: |
    Shift debrief for {orgName}:
    In this shift, you investigated {alertCount} alerts covering {incidentCount} security incident(s) amid heavy background noise.
    Key takeaways:
    - High-volume alert bursts are frequently used by adversaries to mask targeted exploitation.
    - Always verify whether vulnerability scan alerts originate from authorized scanner appliances.
    - Dismissing flapping sensor duplicates systematically frees up analyst bandwidth for genuine threats.

hooks:
  enrichmentHooks:
    - id: "hook-ip-reputation"
      provider: "reputation"
      dataPoints:
        - "abuse_confidence_score"
        - "asn"
  queryDatasetHooks:
    - datasetName: "siem_telemetry_flow"
      extraEventGenerators:
        - "generate_dns_flows"
  evidenceViewHooks:
    - id: "hook-auth-timeline"
      viewType: "timeline"
  reportRubricHooks:
    - sectionId: "executive_summary"
      criteria:
        - "Differentiated authorized scan from exploit"
        - "Classified sensor flapping duplicates"
