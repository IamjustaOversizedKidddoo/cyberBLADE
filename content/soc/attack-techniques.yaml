version: 1
catalog:
  - id: "T1595"
    tactic: "Reconnaissance"
    tacticId: "TA0043"
    name: "Active Scanning"
    description: "Adversary probes victim infrastructure via network/port sweeps or vulnerability scanners."

  - id: "T1566.001"
    tactic: "Initial Access"
    tacticId: "TA0001"
    name: "Phishing: Spearphishing Attachment"
    description: "Adversary sends targeted emails with malicious attachments (e.g. macro documents, archives, scripts)."

  - id: "T1566.002"
    tactic: "Initial Access"
    tacticId: "TA0001"
    name: "Phishing: Spearphishing Link"
    description: "Adversary sends targeted emails containing links leading to credential harvesting sites or direct payload downloads."

  - id: "T1190"
    tactic: "Initial Access"
    tacticId: "TA0001"
    name: "Exploit Public-Facing Application"
    description: "Adversary leverages vulnerabilities in internet-accessible software or services (e.g. SQLi, RCE)."

  - id: "T1078"
    tactic: "Initial Access"
    tacticId: "TA0001"
    name: "Valid Accounts"
    description: "Adversary accesses systems using stolen, default, or compromised legitimate user credentials."

  - id: "T1059.001"
    tactic: "Execution"
    tacticId: "TA0002"
    name: "Command and Scripting Interpreter: PowerShell"
    description: "Adversary executes malicious commands, scripts, or encoded commands via Windows PowerShell."

  - id: "T1059.003"
    tactic: "Execution"
    tacticId: "TA0002"
    name: "Command and Scripting Interpreter: Windows Command Shell"
    description: "Adversary executes system commands using cmd.exe."

  - id: "T1204.002"
    tactic: "Execution"
    tacticId: "TA0002"
    name: "User Execution: Malicious File"
    description: "Victim opens an untrusted attachment, executable, or script."

  - id: "T1053.005"
    tactic: "Persistence"
    tacticId: "TA0003"
    name: "Scheduled Task/Job: Scheduled Task"
    description: "Adversary configures scheduled tasks via schtasks or task scheduler to maintain execution."

  - id: "T1547.001"
    tactic: "Persistence"
    tacticId: "TA0003"
    name: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
    description: "Adversary adds programs to Registry Run keys or Startup folders to execute upon user login."

  - id: "T1136"
    tactic: "Persistence"
    tacticId: "TA0003"
    name: "Create Account"
    description: "Adversary creates local, domain, or cloud accounts to maintain access."

  - id: "T1078.004"
    tactic: "Privilege Escalation"
    tacticId: "TA0004"
    name: "Valid Accounts: Cloud Accounts"
    description: "Adversary leverages cloud service accounts, roles, or API keys with elevated administrative privileges."

  - id: "T1027"
    tactic: "Defense Evasion"
    tacticId: "TA0005"
    name: "Obfuscated Files or Information"
    description: "Adversary encodes, compresses, or encrypts payloads (e.g. base64, XOR) to bypass static detection."

  - id: "T1070"
    tactic: "Defense Evasion"
    tacticId: "TA0005"
    name: "Indicator Removal"
    description: "Adversary deletes event logs, history files, or drop locations to impede forensic analysis."

  - id: "T1110.001"
    tactic: "Credential Access"
    tacticId: "TA0006"
    name: "Brute Force: Password Guessing"
    description: "Adversary attempts systematic password combinations against specific user accounts."

  - id: "T1110.003"
    tactic: "Credential Access"
    tacticId: "TA0006"
    name: "Brute Force: Password Spraying"
    description: "Adversary tests a small set of common passwords across many user accounts to evade account lockouts."

  - id: "T1003"
    tactic: "Credential Access"
    tacticId: "TA0006"
    name: "OS Credential Dumping"
    description: "Adversary dumps credentials, hashes, or Kerberos tickets from memory (e.g. LSASS) or disk."

  - id: "T1556"
    tactic: "Credential Access"
    tacticId: "TA0006"
    name: "Modify Authentication Process / MFA Fatigue"
    description: "Adversary inundates victims with MFA push notifications until acceptance is granted."

  - id: "T1087"
    tactic: "Discovery"
    tacticId: "TA0007"
    name: "Account Discovery"
    description: "Adversary enumerates local, domain, or cloud user accounts and permission groups."

  - id: "T1082"
    tactic: "Discovery"
    tacticId: "TA0007"
    name: "System Information Discovery"
    description: "Adversary identifies host OS, architecture, patch levels, and installed hardware."

  - id: "T1046"
    tactic: "Discovery"
    tacticId: "TA0007"
    name: "Network Service Discovery"
    description: "Adversary enumerates open network ports and listening remote services."

  - id: "T1021.001"
    tactic: "Lateral Movement"
    tacticId: "TA0008"
    name: "Remote Services: Remote Desktop Protocol"
    description: "Adversary moves laterally across internal systems using RDP connections."

  - id: "T1021.002"
    tactic: "Lateral Movement"
    tacticId: "TA0008"
    name: "Remote Services: SMB/Windows Admin Shares"
    description: "Adversary accesses remote systems via SMB and administrative hidden shares (e.g. C$, ADMIN$)."

  - id: "T1071.001"
    tactic: "Command and Control"
    tacticId: "TA0011"
    name: "Application Layer Protocol: Web Protocols"
    description: "Adversary communicates with external C2 infrastructure using HTTP or HTTPS requests."

  - id: "T1071.004"
    tactic: "Command and Control"
    tacticId: "TA0011"
    name: "Application Layer Protocol: DNS"
    description: "Adversary communicates or tunnels data over DNS query/response structures."

  - id: "T1105"
    tactic: "Command and Control"
    tacticId: "TA0011"
    name: "Ingress Tool Transfer"
    description: "Adversary transfers malicious utilities, tools, or secondary payloads into the target environment."

  - id: "T1041"
    tactic: "Exfiltration"
    tacticId: "TA0010"
    name: "Exfiltration Over C2 Channel"
    description: "Adversary exfiltrates stolen data back through established command-and-control communication channels."

  - id: "T1567"
    tactic: "Exfiltration"
    tacticId: "TA0010"
    name: "Exfiltration Over Web Service"
    description: "Adversary exfiltrates data to external legitimate cloud storage providers (e.g. Mega, Google Drive, S3)."

  - id: "T1486"
    tactic: "Impact"
    tacticId: "TA0040"
    name: "Data Encrypted for Impact"
    description: "Adversary encrypts organizational data to interrupt business operations (ransomware)."
