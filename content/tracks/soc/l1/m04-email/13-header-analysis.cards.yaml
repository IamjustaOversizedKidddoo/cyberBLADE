lesson: soc-l1-email-headers-01
cards:
  - id: fc-soc-l1-email-headers-01
    front: "Which way do you read Received: lines to follow an email's path?"
    back: "Bottom up. Each mail server adds its Received line at the top, so the oldest hop is at the bottom."
  - id: fc-soc-l1-email-headers-02
    front: "What does SPF check?"
    back: "Whether the delivering server is allowed (by the domain's DNS record) to send mail for the envelope sender's domain."
  - id: fc-soc-l1-email-headers-03
    front: "What does DMARC add on top of SPF and DKIM?"
    back: "Alignment: the visible From domain must match a domain that passed SPF or DKIM, plus the owner's policy (none, quarantine or reject)."
  - id: fc-soc-l1-email-headers-04
    front: "Return-Path vs From: which one does the reader see?"
    back: "From. Return-Path records the envelope sender (where bounces go); the From line is written by the sender and shown to the reader."
  - id: fc-soc-l1-email-headers-05
    front: "Why can SPF fail on legitimate forwarded mail?"
    back: "The forwarding server is not on the original domain's SPF list. A DKIM signature on unchanged content usually still verifies."
