lesson: soc-l1-credential-attacks-01
questions:
  - id: q1
    prompt: "Why does credential stuffing succeed more often than password spraying?"
    objectives: ["soc:soc_credential_attacks"]
    options:
      - text: "It uses real passwords leaked from other breaches, and many people reuse passwords."
        correct: true
        explanation: "Correct. Each attempt is a password the person actually used somewhere."
      - text: "It tries more passwords per account."
        correct: false
        explanation: "Stuffing usually tries each account once."
      - text: "It only targets administrators."
        correct: false
        explanation: "It targets whatever accounts appear in the leaked list."
      - text: "It disables MFA first."
        correct: false
        explanation: "It does not; MFA is one of the best defences against it."
  - id: q2
    prompt: "Which count best reveals one source spraying many accounts?"
    objectives: ["soc:soc_credential_attacks"]
    options:
      - text: "Distinct accounts per source."
        correct: true
        explanation: "Correct. A high distinct count from one outside source is the spraying shape."
      - text: "Failures per account."
        correct: false
        explanation: "That reveals brute force on one account; spraying keeps it low."
      - text: "Total successful sign-ins for the day."
        correct: false
        explanation: "That mixes everyone's normal activity together."
      - text: "Bytes sent by the source."
        correct: false
        explanation: "Sign-in attempts are small; volume does not help here."
  - id: q3
    prompt: "No accounts were locked out today. Does that mean there was no password attack?"
    objectives: ["soc:soc_credential_attacks"]
    options:
      - text: "No. Low-and-slow attacks are designed to stay under lockout thresholds."
        correct: true
        explanation: "Correct. Look for coordination across time and sources."
      - text: "Yes. Every attack causes lockouts."
        correct: false
        explanation: "Careful attackers avoid them on purpose."
      - text: "Yes, if MFA is enabled."
        correct: false
        explanation: "MFA reduces the impact but does not stop attempts."
      - text: "Only if the firewall was off."
        correct: false
        explanation: "Sign-in attacks usually come through allowed services."
  - id: q4
    prompt: "One internal address shows failures for 400 different accounts. It is the company's web mail gateway. What is the most likely explanation?"
    objectives: ["soc:soc_credential_attacks"]
    options:
      - text: "Shared infrastructure: the gateway signs users in on their behalf, so everyone appears from it."
        correct: true
        explanation: "Correct. Check the success rate and timing; normal traffic looks normal."
      - text: "The gateway is compromised and spraying."
        correct: false
        explanation: "Possible in theory, but the ordinary explanation fits; check before concluding."
      - text: "400 people forgot their passwords at once."
        correct: false
        explanation: "Spread over a day, a few failures each is normal background."
      - text: "The identity provider is broken."
        correct: false
        explanation: "It is working; it just sees the gateway's address."
  - id: q5
    prompt: "A spraying attack produced one successful sign-in. What comes next?"
    objectives: ["soc:soc_credential_attacks"]
    options:
      - text: "Treat the account as compromised: check MFA, what it did next, and other successes from the same sources."
        correct: true
        explanation: "Correct. Then escalate with the sources and accounts involved."
      - text: "Block the one source address and close the alert."
        correct: false
        explanation: "The account is already compromised, and other sources may have succeeded too."
      - text: "Wait to see if the account does anything suspicious."
        correct: false
        explanation: "Waiting gives the attacker time."
      - text: "Ask the user whether they were spraying."
        correct: false
        explanation: "The user is the victim; secure the account and investigate."
