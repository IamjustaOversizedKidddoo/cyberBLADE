lesson: soc-l1-credential-attacks-01
exercises:
  - id: count-attacks
    title: "Count your way to the attack"
    kind: query
    instructions: >-
      These summaries come from the identity provider for one day. 172.16.40.6 is Larkspur's VPN
      gateway, which all remote staff sign in through.
    blocks:
      - type: table
        title: "Sign-in summary by source (synthetic)"
        columns: ["Source", "Failures", "Distinct accounts", "Successes", "Pattern"]
        rows:
          - ["172.16.40.6", "180", "150", "2,900", "Office hours, normal mix"]
          - ["192.0.2.60", "1", "1", "0", "One failure"]
          - ["192.0.2.61 to 192.0.2.99 (39 sources)", "41", "40", "1", "One try per account, about every 30 minutes, all overnight"]
          - ["192.0.2.100", "300", "1", "0", "300 tries on account svc-print in 10 minutes, then locked"]
    questions:
      - id: low-slow
        prompt: "Which row shows a low-and-slow spraying attack?"
        answer_type: choice
        options: ["172.16.40.6", "192.0.2.60", "192.0.2.61 to 192.0.2.99 (39 sources)", "192.0.2.100"]
        accept: ["192.0.2.61 to 192.0.2.99 (39 sources)"]
        hints:
          - "Which row spreads its attempts so thinly that no source or account crosses a threshold?"
        explanation: >-
          Thirty-nine sources trying one account each, half an hour apart, overnight: coordinated and
          designed to stay under limits.
      - id: brute
        prompt: "Which row is brute force?"
        answer_type: choice
        options: ["172.16.40.6", "192.0.2.60", "192.0.2.61 to 192.0.2.99 (39 sources)", "192.0.2.100"]
        accept: ["192.0.2.100"]
        hints:
          - "Which row tries many passwords on a single account?"
        explanation: >-
          300 attempts on one account in ten minutes, ending in a lockout, is brute force.
      - id: priority
        prompt: "What is the single most urgent finding in this table?"
        answer_type: choice
        options:
          - "The one success from the 39-source spraying group"
          - "The 180 failures through the VPN gateway"
          - "The lockout of svc-print"
          - "The single failure from 192.0.2.60"
        accept: ["The one success from the 39-source spraying group"]
        hints:
          - "Which row has an attacker actually getting in?"
        explanation: >-
          A success from the attacking group means a real account is compromised. The gateway is shared
          infrastructure, and the lockout stopped the brute force.
