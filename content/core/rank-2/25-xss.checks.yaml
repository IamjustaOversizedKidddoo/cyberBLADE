lesson: core-r2-xss-01
questions:
  - id: q1
    prompt: "What distinguishes Stored (Persistent) XSS from Reflected XSS?"
    objectives: ["secplus:2.2"]
    options:
      - text: "Stored XSS payloads are saved in the application's backend database, executing automatically for any user viewing the page without requiring a crafted phishing link."
        correct: true
        explanation: "Correct. Stored XSS resides permanently in the database (e.g. comments or profiles), affecting all users who view the resource."
      - text: "Stored XSS operates exclusively over Bluetooth."
        correct: false
        explanation: "XSS is a web application vulnerability, unrelated to Bluetooth."
      - text: "Stored XSS requires root access to the database server."
        correct: false
        explanation: "Stored XSS is introduced via standard unprivileged user input forms."
      - text: "Stored XSS cannot execute JavaScript."
        correct: false
        explanation: "All XSS variants execute client-side JavaScript."
  - id: q2
    prompt: "Which client-side JavaScript execution 'sink' is notoriously vulnerable to DOM-based XSS when supplied with untrusted input?"
    objectives: ["secplus:2.2"]
    options:
      - text: "element.innerHTML"
        correct: true
        explanation: "Correct. Assigning untrusted strings to element.innerHTML parses and executes any embedded HTML/script tags in the browser DOM."
      - text: "element.textContent"
        correct: false
        explanation: "element.textContent treats input strictly as plain text, rendering it safely without script execution."
      - text: "console.log()"
        correct: false
        explanation: "console.log writes diagnostic information to the developer console without DOM execution."
      - text: "Math.random()"
        correct: false
        explanation: "Math.random produces pseudo-random numbers."
  - id: q3
    prompt: "How does a strict Content Security Policy (CSP) with script nonces mitigate XSS attacks?"
    objectives: ["secplus:2.5"]
    options:
      - text: "The browser will refuse to execute any script unless it includes a cryptographically random, one-time nonce token generated by the server for that specific HTTP response."
        correct: true
        explanation: "Correct. An attacker cannot predict the server's per-request random nonce, so injected scripts lack the valid nonce and are blocked by the browser."
      - text: "It converts JavaScript into Python bytecode before execution."
        correct: false
        explanation: "CSP does not transpile languages; it enforces resource loading policies."
      - text: "It scans the user's hard drive for antivirus definitions."
        correct: false
        explanation: "CSP is an HTTP browser policy, not an endpoint antivirus scanner."
      - text: "It prevents users from using passwords shorter than 12 characters."
        correct: false
        explanation: "Password complexity is governed by authentication policies, not CSP."
  - id: q4
    prompt: "Why is context-aware output encoding (HTML entity encoding) effective at stopping reflected and stored XSS?"
    objectives: ["secplus:2.5"]
    options:
      - text: "It replaces dangerous characters like '<' and '>' with safe entity representations ('&lt;' and '&gt;'), ensuring the browser parses them strictly as visual display text rather than HTML tags."
        correct: true
        explanation: "Correct. Entity encoding neutralizes the syntactic meaning of HTML markup tags, ensuring browsers treat them as text."
      - text: "It encrypts the entire database."
        correct: false
        explanation: "Output encoding takes place during rendering; it does not encrypt database storage."
      - text: "It prevents users from opening browser developer tools."
        correct: false
        explanation: "Output encoding does not restrict access to browser developer tools."
      - text: "It blocks cross-origin DNS lookups."
        correct: false
        explanation: "DNS lookups are unrelated to output encoding."
